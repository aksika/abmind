name: Stale

on:
  schedule:
    - cron: "0 4 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          stale-issue-message: "This issue has been inactive for 60 days. It will be closed in 14 days unless there's new activity."
          stale-pr-message: "This PR has been inactive for 30 days. It will be closed in 14 days unless updated."
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-issue-close: 14
          days-before-pr-close: 14
          exempt-issue-labels: "pinned,security,good first issue"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
