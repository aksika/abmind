name: Release

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Publish to npm (latest)
        run: npm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          URL="https://registry.npmjs.org/abmind/-/abmind-${VERSION}.tgz"
          sleep 10
          SHA=$(curl -sL "$URL" | shasum -a 256 | cut -d' ' -f1)
          echo "version=$VERSION url=$URL sha=$SHA"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/aksika/homebrew-tap.git" /tmp/tap
          cd /tmp/tap
          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/abmind.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/abmind.rb
          git config user.name "aksika"
          git config user.email "aksika@gmail.com"
          git add Formula/abmind.rb
          git commit -m "abmind ${VERSION}" || echo "no change"
          git push

  verify-install:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Verify the freshly published release via the standalone bootstrap
      # (no `npm install -g`). This mirrors the fresh-machine registry path.
      - name: Standalone bootstrap from npm
        env:
          ABMIND_INSTALL_ARGS: "--non-interactive --passphrase testpass --username ci"
        run: |
          mkdir -p "$HOME/.local/bin"
          sh scripts/install-standalone.sh

      - name: Verify CLI runs
        run: abmind --help

      - name: Provision native deps (better-sqlite3)
        run: abmind deps install

      - name: Verify install flow
        run: abmind install --non-interactive --passphrase testpass --username ci

      - name: Verify version matches
        run: |
          EXPECTED=$(npm view abmind version)
          ACTUAL=$(abmind --version 2>&1 | head -1)
          echo "npm=$EXPECTED installed=$ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ]
